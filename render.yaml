# Render Blueprint — one web service that runs the Express API and serves the React build.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for MONGODB_URI.
services:
  - type: web
    name: embo
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SEED_ON_EMPTY
        value: "true"
